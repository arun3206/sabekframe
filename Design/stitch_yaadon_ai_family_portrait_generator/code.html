<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>

<script>
        function selectCard(clickedCard) {
            const allCards = document.querySelectorAll('#relationship-grid > button');
            const continueBtn = document.getElementById('continue-btn');

            // Deselect all
            allCards.forEach(card => {
                card.classList.remove('card-selected');
                card.classList.add('card-unselected');
            });

            // Select clicked
            clickedCard.classList.remove('card-unselected');
            clickedCard.classList.add('card-selected');

            // Enable Continue button
            continueBtn.disabled = false;
            continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
            continueBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:bg-primary', 'hover:text-on-primary', 'shadow-md', 'hover:shadow-lg', 'cursor-pointer');
            continueBtn.style.transform = 'scale(1.02)';
            setTimeout(() => continueBtn.style.transform = 'scale(1)', 150);
        }
    </script>
